name: CI — Build, Test and SonarCloud

on:
  push:
    branches: [ "main", "tp2", "tp3", "tp4" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installation du JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Master Key fictive pour les tests CI
      - name: Set test Master Key
        run: echo "APP_MASTER_KEY=test_master_key_for_ci_only" >> $GITHUB_ENV

      # 4. Build + Tests
      - name: Build and run tests
        run: mvn clean verify
        env:
          APP_MASTER_KEY: test_master_key_for_ci_only

      # 5. Analyse SonarCloud
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io